name: NPDIA Windows installer test

on:
  push:
    branches: [test/desktop-custom]

permissions:
  contents: read

concurrency:
  group: npdia-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.repository == 'NPDIA/mailcraft'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.1 via pinned action
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup 7.1.0 x64
        id: inno
        shell: pwsh
        run: |
          $File = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $Directory = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          $Hash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $File
          if ((Get-FileHash -Algorithm SHA256 $File).Hash -ine $Hash) { throw 'Inno Setup SHA-256 does not match.' }
          $Install = Start-Process -FilePath $File -ArgumentList '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $Directory) -Wait -PassThru
          if ($Install.ExitCode -ne 0) { throw "Inno Setup installation failed ($($Install.ExitCode))." }
          $Compiler = Get-Item -LiteralPath (Join-Path $Directory 'ISCC.exe')
          "compiler=$($Compiler.FullName)" >> $env:GITHUB_OUTPUT
      - name: Build and smoke-test the installer
        id: build
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.compiler }}
        run: |
          $Metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the Cargo workspace version.' }
          $Version = ($Metadata.packages | Where-Object name -CEQ 'mailcraft').version
          $Installer = "dist/installer/MailCraft_NPDIA_Custom-$Version-windows-x64.exe"
          ./packaging/windows/package-npdia.ps1 -Version $Version -SourceCommit $env:GITHUB_SHA -Compiler $env:ISCC
          ./packaging/windows/test-npdia-installer.ps1 -Version $Version -Installer $Installer
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Upload verified installer and build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MailCraft_NPDIA_Custom-${{ steps.build.outputs.version }}-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/BUILDINFO.json
            dist/installer/SHA256SUMS.txt
            dist/installer/installer-smoke.json
            dist/installer/*.log
          if-no-files-found: error
