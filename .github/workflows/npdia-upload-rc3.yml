name: NPDIA RC3 release handoff

on:
  push:
    branches: [release/21-upload-rc3]
    paths: [.github/workflows/npdia-upload-rc3.yml, packaging/windows/test-npdia-imap.py]

permissions:
  contents: read
  actions: read

concurrency:
  group: npdia-upload-rc3

jobs:
  verify:
    if: github.repository == 'NPDIA/mailcraft'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 44675967743
          name: MailCraft_NPDIA_Custom-0.13.9-rc.2-windows-x64
          path: rc2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '44687012428'
          name: MailCraft_NPDIA_Custom-0.13.9-rc.3-windows-x64
          path: rc3
      - name: Retest the built RC3 installer, first IMAP sync, and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Previous = 'rc2/MailCraft_NPDIA_Custom-0.13.9-rc.2-windows-x64.exe'
          $Installer = 'rc3/MailCraft_NPDIA_Custom-0.13.9-rc.3-windows-x64.exe'
          if ((Get-FileHash -LiteralPath $Previous).Hash -ine '4b40dfb79130775b01f8507319767088d35d3d74c40fdf6dd1820c6b993b0a1d') { throw 'Unexpected RC2 installer hash.' }
          if ((Get-FileHash -LiteralPath $Installer).Hash -ine '771ff6f2a3c58f6f2c64546280b1a241817d135b553e070901627f082809d9ed') { throw 'Unexpected RC3 installer hash.' }
          ./packaging/windows/test-npdia-installer.ps1 -Version 0.13.9-rc.3 -Installer $Installer -TestImap
          Copy-Item -LiteralPath rc3/installer-smoke.json -Destination installer-smoke.json
          Copy-Item -LiteralPath rc3/installer-imap.json -Destination installer-imap.json
          ./packaging/windows/test-npdia-installer.ps1 -Version 0.13.9-rc.3 -Installer $Installer -PreviousInstaller $Previous
          Copy-Item -LiteralPath rc3/installer-smoke.json -Destination installer-upgrade-rollback.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npdia-rc3-installer-verification
          path: |
            installer-smoke.json
            installer-imap.json
            installer-upgrade-rollback.json
          if-no-files-found: error

  upload:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '44687012428'
          name: MailCraft_NPDIA_Custom-0.13.9-rc.3-windows-x64
          path: rc3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npdia-rc3-installer-verification
      - name: Upload the verified assets to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=0.13.9-rc.3
          source=efd41936a7f6de7e1424f5049b208965245b9a89
          installer=MailCraft_NPDIA_Custom-$tag-windows-x64.exe
          expected=771ff6f2a3c58f6f2c64546280b1a241817d135b553e070901627f082809d9ed
          gh api repos/NPDIA/mailcraft/actions/runs/44687012428 |
            jq --exit-status --arg source "$source" '.head_sha == $source and .head_branch == "test/desktop-custom" and .workflow_id == 424573606 and .event == "push" and .status == "completed"'
          gh api repos/NPDIA/mailcraft/actions/runs/44687012428/jobs |
            jq --exit-status 'any(.jobs[]; .id == 136123650664 and any(.steps[]; .name == "Build the installer" and .conclusion == "success") and any(.steps[]; .name == "Upload installer and test evidence" and .conclusion == "success"))'
          printf '%s  %s\n' "$expected" "rc3/$installer" | sha256sum --check
          test "$(tr -d '\r' < rc3/SHA256SUMS.txt)" = "$expected  $installer"
          jq --exit-status --arg source "$source" --arg digest "$expected" --arg installer "$installer" --arg tag "$tag" '.source_commit == $source and .installer_sha256 == $digest and .installer == $installer and .version == $tag' rc3/BUILDINFO.json
          jq --exit-status --arg tag "$tag" '.cli_version == $tag and .fresh_install_korean == "passed" and .upgrade_english == "passed as same-version reinstall" and .uninstall == "passed" and .synthetic_profile_retained == "passed"' installer-smoke.json
          jq --exit-status --arg version "mailcraft-cli $tag" '.cli_version == $version and .platform == "nt" and (.tls == "TLSv1.2" or .tls == "TLSv1.3") and .auth == ["AUTHENTICATE PLAIN", "LOGIN"] and .inbox_messages == 1 and .certificate_validation == "untrusted CA was refused"' installer-imap.json
          jq --exit-status --arg tag "$tag" '.cli_version == $tag and .rollback == "passed" and .upgrade_english == "passed from supplied earlier installer" and .synthetic_profile_retained == "passed"' installer-upgrade-rollback.json
          gh release view "$tag" --repo NPDIA/mailcraft --json isDraft,isPrerelease,targetCommitish |
            jq --exit-status --arg source "$source" '.isDraft and .isPrerelease and .targetCommitish == $source'
          gh release upload "$tag" --repo NPDIA/mailcraft \
            "rc3/$installer" rc3/BUILDINFO.json rc3/SHA256SUMS.txt installer-smoke.json \
            installer-imap.json installer-upgrade-rollback.json
